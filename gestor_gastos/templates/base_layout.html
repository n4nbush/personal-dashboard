<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('gastos.static', filename='styles.css') }}">
    <title data-categoria={%block categoria%}{%endblock%} id="titulo">{%block titulo%}{%endblock%}</title>
</head>
<body onload="formateo_monto()">
    <!-- Header con navegación -->
    <header class="header">
        <a href="/" class="btn-home" title="Volver al inicio">🏠</a>
        <h1 class="header-title">{%block header_title%}💰 Gestor{%endblock%}</h1>
        <button onclick="toggleMenu()" id="Boton_menu" class="btn-menu">☰</button>
    </header>
    
    <!-- Menú desplegable -->
    <nav id="menu" class="nav-menu oculto">
        <button onclick="window.location.href='/gs'" id="boton_gastos" class="nav-btn">
            <span class="nav-icon">💰</span>
            <span>Registrar</span>
        </button>
        <button onclick="window.location.href='/gs/movimientos'" id="boton_movimientos" class="nav-btn">
            <span class="nav-icon">📋</span>
            <span>Movimientos</span>
        </button>
        <button onclick="window.location.href='/gs/resumen_grupos'" id="boton_grupos" class="nav-btn">
            <span class="nav-icon">📊</span>
            <span>Resumen</span>
        </button>
    </nav>

    <!-- Contenedor principal -->
    <div class="container">
        {%  block body %}
        {% endblock %}
    </div>

    <script src="{{ url_for('gastos.static', filename='main.js') }}"></script> 
</body>
</html>
