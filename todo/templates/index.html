<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('todo.static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="btn-home">🏠</a>
            <h1>📝 Mis Tareas</h1>
            <div class="spacer"></div>
        </header>
        
        <!-- FILTROS -->
        <div class="filter-container">
            <div class="filter-group">
                <label for="categoria">📂 Categoría:</label>
                <select id="categoria" name="categoria" onchange="filtrarTareas()">
                    <option value="todas">Todas</option>
                    <option value="general">📋 General</option>
                    <option value="peliculas">🎬 Películas</option>
                    <option value="anime">🎌 Anime</option>
                    <option value="moto">🏍️ Moto</option>
                    <option value="auto">🚗 Auto</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="estado">📊 Estado:</label>
                <select id="estado" name="estado" onchange="filtrarTareas()">
                    <option value="todas">Todas</option>
                    <option value="pendientes">⏳ Pendientes</option>
                    <option value="completadas">✅ Completadas</option>
                </select>
            </div>
        </div>
        
        <!-- FORMULARIO AGREGAR TAREA -->
        <form action="/todo/agregar_tarea" method="POST" class="task-form">
            <input type="text" id="tarea" name="tarea" placeholder="✍️ Nueva tarea..." required>
            
            <div class="form-row">
                <select id="nueva_categoria" name="categoria" required>
                    <option value="">Categoría...</option>
                    <option value="general" selected>📋 General</option>
                    <option value="peliculas">🎬 Películas</option>
                    <option value="anime">🎌 Anime</option>
                    <option value="moto">🏍️ Moto</option>
                    <option value="auto">🚗 Auto</option>
                </select>
                
                <button type="submit">➕ Agregar</button>
            </div>
        </form>

        <!-- LISTA DE TAREAS (Cards para móvil, tabla para desktop) -->
        <div class="tasks-list">
            {% for tarea in tareas %}
            <div class="task-card" data-categoria="{{ tarea[3] }}" data-estado="{{ 'completada' if tarea[4] == 1 else 'pendiente' }}">
                <!-- Header de la card -->
                <div class="task-header">
                    <span class="categoria-badge categoria-{{ tarea[3] }}">{{ tarea[3]|title }}</span>
                    <span class="task-date">📅 {{ tarea[1] }}</span>
                </div>
                
                <!-- Contenido de la tarea -->
                <div class="task-content">
                    <p class="task-text {% if tarea[4] == 1 %}completed{% endif %}">{{ tarea[2] }}</p>
                </div>
                
                <!-- Footer con estado y acciones -->
                <div class="task-footer">
                    <div class="task-status">
                        {% if tarea[4] == 1 %}
                            <span class="status-badge status-completed">✅ Completada</span>
                        {% else %}
                            <span class="status-badge status-pending">⏳ Pendiente</span>
                        {% endif %}
                    </div>
                    
                    <div class="task-actions">
                        {% if tarea[4] != 1 %}
                        <form action="/todo/completar" method="post" style="display:inline;">
                            <input type="hidden" name="id" value="{{tarea[0]}}">
                            <button type="submit" class="btn-action btn-complete" title="Completar">✓</button>
                        </form>
                        {% endif %}
                        <form action="/todo/borrar" method="post" style="display:inline;">
                            <input type="hidden" name="id" value="{{tarea[0]}}">
                            <button type="submit" class="btn-action btn-delete" title="Eliminar">🗑️</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- Mensaje si no hay tareas -->
        {% if tareas|length == 0 %}
        <div class="empty-state">
            <p>🎉 No hay tareas. ¡Empieza agregando una!</p>
        </div>
        {% endif %}
    </div>
    
    <script>
        function filtrarTareas() {
            const categoriaSeleccionada = document.getElementById('categoria').value;
            const estadoSeleccionado = document.getElementById('estado').value;
            const cards = document.querySelectorAll('.task-card');
            
            cards.forEach(card => {
                const categoria = card.dataset.categoria;
                const estado = card.dataset.estado;
                
                let mostrarCategoria = categoriaSeleccionada === 'todas' || categoria === categoriaSeleccionada;
                let mostrarEstado = estadoSeleccionado === 'todas' || 
                                   (estadoSeleccionado === 'pendientes' && estado === 'pendiente') ||
                                   (estadoSeleccionado === 'completadas' && estado === 'completada');
                
                if (mostrarCategoria && mostrarEstado) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
